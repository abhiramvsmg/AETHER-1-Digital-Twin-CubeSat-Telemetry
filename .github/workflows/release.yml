name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qt3d qtserialport'

      - name: 🏗️ Configure & Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --parallel 4

      - name: 📦 Package Artifacts
        run: |
          mkdir dist
          copy build\Release\AETHER-1.exe dist\
          # Note: In a real environment, you'd run windeployqt here
          windeployqt dist\AETHER-1.exe

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-1-Windows-Build
          path: dist/

      - name: 🚢 Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
